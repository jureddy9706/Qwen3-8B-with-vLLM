services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    command:
      - --model
      - Qwen/Qwen3-8B
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.90"
    gpus: all
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      VLLM_BASE_URL: http://vllm:8000
      GATEWAY_MAX_ACTIVE: ${GATEWAY_MAX_ACTIVE:-8}
      GATEWAY_MAX_WAITING: ${GATEWAY_MAX_WAITING:-16}
      GATEWAY_QUEUE_TIMEOUT_S: ${GATEWAY_QUEUE_TIMEOUT_S:-2.0}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - vllm
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  hf-cache:
