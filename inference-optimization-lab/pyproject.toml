[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-inference-optimization-lab"
version = "0.1.0"
description = "Reproducible Qwen3-8B serving, workload replay, SLO-aware admission, and observability"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "prometheus-client>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
qwen-lab-bench = "qwen_serving_lab.bench:main"
qwen-lab-compare = "qwen_serving_lab.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
