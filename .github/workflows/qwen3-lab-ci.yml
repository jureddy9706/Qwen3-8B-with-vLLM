name: Qwen3 inference lab CI
on:
  push:
    paths:
      - "inference-optimization-lab/**"
      - ".github/workflows/qwen3-lab-ci.yml"
  pull_request:
    paths:
      - "inference-optimization-lab/**"
      - ".github/workflows/qwen3-lab-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-optimization-lab
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m compileall -q src/
      - run: ruff check src tests --select E4,E7,E9,F
